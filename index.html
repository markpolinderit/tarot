*{box-sizing:border-box}
html,body{margin:0}

nav{position:sticky;top:0;z-index:20;background:rgba(20,16,42,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}

button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:999px;transition:.15s}

button.active,.primary{background:linear-gradient(135deg,var(--gold),#b8893a);color:#1a1430;border-color:transparent;font-weight:600}
button:disabled{opacity:.5;cursor:default}
section.page{display:none;padding:24px 0 60px}
section.page.show{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}

/* ---------- deck opbouwen ---------- */
const RANKN = ["Aas","Twee","Drie","Vier","Vijf","Zes","Zeven","Acht","Negen","Tien"];
const DECK = [];
MAJOR.forEach(m=>DECK.push({...m,id:"major-"+m.n,type:"major"}));
Object.keys(SUITS).forEach(s=>{
  for(let i=1;i<=10;i++) DECK.push({id:s+"-"+i,type:"minor",suit:s,n:i,name:RANKN[i-1]+" van "+SUITS[s].name,kw:MINOR[s][i-1],scene:MINSYM[s+"-"+i]});
  ["S","R","Q","K"].forEach(r=>DECK.push({id:s+"-"+r,type:"court",suit:s,rank:r,name:COURT[r].name+" van "+SUITS[s].name,kw:COURTM[s][r]}));
});
const byId = id=>DECK.find(c=>c.id===id);

/* ---------- iconen ---------- */
const ICON = {

function cardLabel(c){
  if(c.type==="major") return ROMAN[c.n];
  if(c.type==="court") return COURT[c.rank].short;
  return c.n===1?"A":c.n;
}
function cardHTML(c,cls=""){
  const glyph = c.type==="major" ? c.astro+VS : ICON[c.suit];
  const sc = c.suit ? " s-"+c.suit : "";
  return `<div class="card${sc} ${cls}" data-id="${c.id}"><div class="num">${cardLabel(c)}</div><div class="glyph">${glyph}</div><div class="nm">${c.name}</div></div>`;
}

/* ===================== HULP ===================== */
const $ = s=>document.querySelector(s);
const rnd = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce = n=>String(n).split("").reduce((s,d)=>s+ +d,0);
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){return null}}
let STATS = store("tarot-stats")||{};   // {id:{ok,bad}}
let BEST = store("tarot-best")||{runs:0,best:0};

function weightedPick(pool){
  const w = pool.map(c=>{const s=STATS[c.id]||{ok:0,bad:0};return 1+s.bad*2-Math.min(s.ok,3)*.2});
  let t = w.reduce((a,b)=>a+Math.max(b,.3),0), r=Math.random()*t;
  for(let i=0;i<pool.length;i++){r-=Math.max(w[i],.3);if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
// maak meerkeuze: correct + 3 unieke afleiders
function mc(correct,pool){
  const opts=[correct];
  for(const o of shuffle(pool)){ if(opts.length>=4)break; if(!opts.includes(o)) opts.push(o); }
  return shuffle(opts);
}

/* ===================== VRAAGGENERATOREN ===================== */
const majors = DECK.filter(c=>c.type==="major");
const minors = DECK.filter(c=>c.type==="minor");

const numExplain = c=>`Numerologie: ${c.n===1?"de Aas (1)":"de "+c.n} staat voor <b>${NUM[c.n].t.toLowerCase()}</b> (${NUM[c.n].d}); ${SUITS[c.suit].name} = <b>${SUITS[c.suit].el}</b> (${SUITS[c.suit].theme}).`;

   return {card:c,id:c.id,q:`Wat betekent de <b>${c.name}</b>?`,opts:mc(c.kw,pool),ans:c.kw,ex:numExplain(c)+(c.scene?`<br>Beeld: ${c.scene}`:"")}},

  ()=>{const keys=Object.keys(MINSYM);const k=rnd(keys);const c=byId(k);const pool=minors.filter(m=>m.n===c.n||m.suit===c.suit).map(m=>m.name);
   return {id:c.id,q:`Welke kaart toont dit beeld? <i>"${MINSYM[k]}"</i>`,opts:mc(c.name,pool),ans:c.name,ex:`${c.name}: ${c.kw}. `+numExplain(c)}}
 ],
 court:[

   return {id:c.id,q:`Welke hofkaart beschrijft: <i>"${c.kw}"</i>?`,opts:mc(c.name,pool),ans:c.name,ex:`${COURT[c.rank].name}: ${COURT[c.rank].role}. ${SUITS[c.suit].name} = ${SUITS[c.suit].el}. Samen: "${COURT[c.rank].el.toLowerCase()} van ${SUITS[c.suit].el.toLowerCase()}".`}},
  ()=>{const r=rnd(Object.keys(COURT));const opts=mc(COURT[r].name,Object.values(COURT).map(x=>x.name));
   return {id:"court-"+r,q:`Welke rang staat voor: <i>"${COURT[r].role}"</i>?`,opts,ans:COURT[r].name,ex:`De ${COURT[r].name} hoort (Golden Dawn) bij het element ${COURT[r].el}.`}}
 ],
 symbol:[
  ()=>{const c=weightedPick(majors);const s=rnd(c.sym);const opts=mc(c.name,majors.map(m=>m.name));
   return {id:c.id,q:`Op welke kaart zie je: <b>${s[0].toLowerCase()}</b>?`,opts,ans:c.name,ex:`${s[0]} op ${c.name}: ${s[1]}.`}},
  ()=>{const c=weightedPick(majors);const s=rnd(c.sym);const all=majors.flatMap(m=>m.sym.map(x=>x[1]));
   return {card:c,id:c.id,q:`Wat symboliseert <b>${s[0].toLowerCase()}</b> op ${c.name}?`,opts:mc(s[1],all),ans:s[1],ex:`${c.name}: ${c.kw}.`}},
  ()=>{const s=rnd(COLORS);const opts=mc(s[1],COLORS.map(x=>x[1]));
   return {id:"kleur-"+s[0],q:`Waar staat de kleur <b>${s[0].toLowerCase()}</b> meestal voor in de tarot?`,opts,ans:s[1],ex:`Bijvoorbeeld: ${s[2]}.`}},
  ()=>{const s=rnd(SYMBOLS);const opts=mc(s[1],SYMBOLS.map(x=>x[1]));
   return {id:"sym-"+s[0],q:`Wat betekent het terugkerende symbool <b>${s[0].toLowerCase()}</b>?`,opts,ans:s[1],ex:`${s[0]}: ${s[1]}.`}}
 ],
 numero:[
  ()=>{const n=Math.floor(Math.random()*11);const opts=mc(NUM[n].t+" — "+NUM[n].d,Object.values(NUM).map(x=>x.t+" — "+x.d));
   const maj=MAJOR[n];return {id:"num-"+n,q:`Waar staat het getal <b>${n}</b> voor in de tarot-numerologie?`,opts,ans:NUM[n].t+" — "+NUM[n].d,ex:`Bij de Grote Arcana hoort ${n} bij ${maj.name} (${maj.kw}).`}},
  ()=>{const c=weightedPick(majors);const opts=mc(ROMAN[c.n],ROMAN.slice());
   return {id:c.id,q:`Welk nummer draagt <b>${c.name}</b>?`,opts,ans:ROMAN[c.n],ex:`${c.name} is kaart ${c.n} (${ROMAN[c.n]}). `+(c.n>9?`Reductie: ${String(c.n).split("").join(" + ")} = ${reduce(c.n)} → ${MAJOR[reduce(c.n)].name}.`:`${NUM[c.n].t}: ${NUM[c.n].d}.`)}},
  ()=>{const c=weightedPick(majors.filter(m=>m.n>=10));const r=reduce(c.n);const root=MAJOR[r];const opts=mc(root.name,majors.filter(m=>m.n<10).map(m=>m.name));
   return {card:c,id:c.id,q:`Tot welke kaart reduceert <b>${c.name}</b> (${ROMAN[c.n]})?`,opts,ans:root.name,ex:`${String(c.n).split("").join(" + ")} = ${r}: ${root.name}. ${c.name} (${c.kw}) is een hogere octaaf van ${root.name} (${root.kw}).`}},

   const pool=Object.values(NUM).slice(1).map(x=>x.t);
   return {card:c,id:c.id,q:`Welk numerologisch thema zit in de <b>${c.name}</b>?`,opts:mc(NUM[n].t,pool),ans:NUM[n].t,ex:numExplain(c)+` Vandaar: ${c.kw}.`}},
  ()=>{const row=rnd([0,1,2]);const names=["het bewuste: de wereld en het ego","het innerlijk: zelfonderzoek en karakter","het spirituele: transformatie en verlichting"];
   const first=MAJOR[row*7+1].name, last=MAJOR[row*7+7].name;
   return {id:"rij-"+row,q:`In de Narrenreis vormt kaart ${ROMAN[row*7+1]} t/m ${ROMAN[row*7+7]} (${first} → ${last}) een rij. Waar gaat die fase over?`,opts:shuffle(names),ans:names[row],ex:`De drie rijen van zeven: I–VII de buitenwereld, VIII–XIV de binnenwereld, XV–XXI de spirituele wereld.`}}
 ],

   return {id:"sign-"+s,q:`Welke sterrenbeelden horen bij <b>${SUITS[s].name}</b> (${SUITS[s].el})?`,opts,ans:SUITS[s].signs,ex:`${SUITS[s].el}tekens: ${SUITS[s].signs}.`}},
  ()=>{const s=rnd(Object.keys(SUITS));const opts=mc(SUITS[s].theme,Object.values(SUITS).map(x=>x.theme));
   return {id:"theme-"+s,q:`Over welk levensgebied gaan de <b>${SUITS[s].name}</b>?`,opts,ans:SUITS[s].theme,ex:`In gewone speelkaarten zijn ${SUITS[s].name} de ${SUITS[s].cards}.`}},
  ()=>{const c=weightedPick(majors);const opts=mc(c.astroName,majors.map(m=>m.astroName));
   return {card:c,id:c.id,q:`Welke astrologische correspondentie hoort bij <b>${c.name}</b>?`,opts,ans:c.astroName,ex:`${c.name} ↔ ${c.astro}${VS} ${c.astroName}.`}}
 ]
};

/* ===================== QUIZ ===================== */
let Q = null;
function renderStats(){
  const seen=Object.keys(STATS).length, ok=Object.values(STATS).reduce((a,s)=>a+s.ok,0), bad=Object.values(STATS).reduce((a,s)=>a+s.bad,0);
  $("#statBox").innerHTML = BEST.runs?`<div><b>${BEST.runs}</b>tests gedaan</div><div><b>${BEST.best}%</b>beste score</div><div><b>${ok+bad?Math.round(ok/(ok+bad)*100):0}%</b>totaal goed</div><div><b>${seen}</b>onderwerpen geoefend</div>`:"";
}
function startQuiz(){
  const cats=[...document.querySelectorAll("#quizSetup input:checked")].map(i=>i.value);
  if(!cats.length){alert("Kies minstens één onderwerp.");return}
  const len=+$("#qLen").value, qs=[], used=new Set();
  let guard=0;
  while(qs.length<len && guard++<len*20){
    const q=rnd(GEN[rnd(cats)])();
    const key=q.q+q.ans; if(used.has(key))continue; used.add(key); qs.push(q);
  }
  Q={qs,i:0,score:0,wrong:[]};
  $("#quizSetup").style.display="none"; $("#quizRun").style.display="block";
  showQ();
}
function showQ(){
  const q=Q.qs[Q.i];
  $("#quizRun").innerHTML=`
   <div class="qhead"><span>Vraag ${Q.i+1} van ${Q.qs.length}</span><span>Score: ${Q.score}</span></div>
   <div class="progress"><div style="width:${Q.i/Q.qs.length*100}%"></div></div>
   ${q.card?`<div class="qcard">${cardHTML(q.card)}</div>`:""}
   <div class="qtext">${q.q}</div>
   <div class="opts" style="clear:both">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
   <div id="fb"></div>
   <p style="display:flex;justify-content:space-between;gap:8px"><button onclick="endQuiz(true)">Stoppen</button><button class="primary" id="next" style="display:none">${Q.i+1<Q.qs.length?"Volgende →":"Bekijk resultaat"}</button></p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
  $("#next").onclick=()=>{Q.i++; Q.i<Q.qs.length?showQ():endQuiz()};
  window.scrollTo({top:$("#quizRun").offsetTop-70,behavior:"smooth"});
}
function answer(b){
  const q=Q.qs[Q.i], pick=q.opts[+b.dataset.k], ok=pick===q.ans;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(q.opts[+x.dataset.k]===q.ans)x.classList.add("correct")});
  if(!ok)b.classList.add("wrong");
  const s=STATS[q.id]||{ok:0,bad:0}; ok?s.ok++:s.bad++; STATS[q.id]=s; store("tarot-stats",STATS);
  if(ok)Q.score++; else Q.wrong.push(q);
  $("#fb").innerHTML=`<div class="explain"><b style="color:var(${ok?"--ok":"--bad"})">${ok?"✓ Goed!":"✗ Helaas."}</b> ${ok?"":"Juist: <b>"+q.ans+"</b><br>"}${q.ex}</div>`;
  $("#next").style.display="inline-block"; $("#next").focus();
}
function endQuiz(stopped){
  const done=stopped?Q.i:Q.qs.length; if(!done){resetQuiz();return}
  const pct=Math.round(Q.score/done*100);
  BEST.runs++; BEST.best=Math.max(BEST.best,pct); store("tarot-best",BEST);
  const msg=pct>=90?"Meester van de Arcana! ☉":pct>=70?"Mooi werk — De Ster schijnt op je. ✶":pct>=50?"Goed op weg, Magiër in opleiding.":"De Dwaas begint aan zijn reis — blijf oefenen!";
  $("#quizRun").innerHTML=`<div style="text-align:center"><div class="score">${Q.score} / ${done}</div><h3>${msg}</h3>
   <p><button class="primary" onclick="startQuiz()">Nog een keer</button> <button onclick="resetQuiz()">Andere onderwerpen</button></p></div>
   ${Q.wrong.length?`<h3>Om te herhalen</h3>`+Q.wrong.map(q=>`<div class="mist"><div>${q.q}</div><div>→ <b>${q.ans}</b></div><div class="muted">${q.ex}</div></div>`).join(""):""}`;
}
function resetQuiz(){ $("#quizRun").style.display="none"; $("#quizSetup").style.display="block"; renderStats(); }
$("#startQuiz").onclick=startQuiz;

/* ===================== NUMEROLOGIE / SYMBOLIEK ===================== */
function renderStatic(){
  $("#numTable").innerHTML=`<tr><th>Getal</th><th>Thema</th><th>Grote Arcana</th><th>Kleine Arcana (voorbeeld)</th></tr>`+
   Object.keys(NUM).map(n=>`<tr><td><b>${n}</b></td><td><b>${NUM[n].t}</b><br><span class="muted">${NUM[n].d}</span></td><td>${MAJOR[n].name}</td><td>${n>0?RANKN[n-1]+"en: "+["staven","bekers","zwaarden","pentakels"].map(s=>MINOR[s][n-1].split(",")[0]).join(" · "):"—"}</td></tr>`).join("");
  const rows=["I–VII · De buitenwereld: bewustzijn, ego en maatschappij","VIII–XIV · De binnenwereld: karakter, zelfonderzoek en loslaten","XV–XXI · De spirituele wereld: schaduw, verlichting en heelheid"];
  $("#rows7").innerHTML=`<div class="row7">${cardHTML(MAJOR[0]&&{...MAJOR[0],id:"major-0",type:"major"})}</div>`+
   rows.map((t,r)=>`<div class="muted">${t}</div><div class="row7">${majors.slice(r*7+1,r*7+8).map(c=>cardHTML(c)).join("")}</div>`).join("");
  let red="";
  for(let n=1;n<=9;n++){
    const fam=majors.filter(m=>m.n>0&&(m.n===n||(m.n>9&&reduce(m.n)===n)||(m.n>9&&reduce(reduce(m.n))===n&&reduce(m.n)>9)));
    red+=`<div class="mist"><b>${n} · ${NUM[n].t}</b>: ${fam.map(m=>`${m.name} (${ROMAN[m.n]})`).join(" → ")}</div>`;
  }
  $("#reduct").innerHTML=red;
  $("#suitInfo").innerHTML=Object.keys(SUITS).map(s=>`<div class="panel"><div style="display:flex;gap:12px;align-items:center"><div class="card s-${s}" style="width:60px;padding:4px;cursor:default"><div class="glyph">${ICON[s]}</div></div><div><h3 style="margin:0">${SUITS[s].name}</h3><div class="muted">${SUITS[s].el} · ${SUITS[s].signs}</div></div></div><p>${SUITS[s].theme}.</p><p class="muted" style="margin:0">In speelkaarten: ${SUITS[s].cards}</p></div>`).join("");
  $("#courtTable").innerHTML=`<tr><th>Rang</th><th>Element</th><th>Rol</th></tr>`+Object.values(COURT).map(c=>`<tr><td><b>${c.name}</b></td><td>${c.el}</td><td>${c.role}</td></tr>`).join("");
  $("#colorTable").innerHTML=`<tr><th>Kleur</th><th>Betekenis</th><th>Voorbeeld</th></tr>`+COLORS.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td class="muted">${c[2]}</td></tr>`).join("");
  $("#symTable").innerHTML=`<tr><th>Symbool</th><th>Betekenis</th></tr>`+SYMBOLS.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td></tr>`).join("");
}

/* ===================== GEBOORTEKAART ===================== */
$("#calcBirth").onclick=()=>{
  const v=$("#bdate").value; if(!v){$("#birthOut").innerHTML="<p class='muted'>Kies eerst een datum.</p>";return}
  const [y,m,d]=v.split("-").map(Number);
  const sum=d+m+y; const steps=[`${d} + ${m} + ${y} = ${sum}`];
  let n=sum;
  while(n>22){const r=reduce(n);steps.push(`${String(n).split("").join(" + ")} = ${r}`);n=r}
  const pers = n===22?0:n;
  const chain=[pers];
  let k=n; while(k>9){k=reduce(k);chain.push(k)}
  const uniq=[...new Set(chain)];
  const cards=uniq.map(i=>({...MAJOR[i],id:"major-"+i,type:"major"}));
  $("#birthOut").innerHTML=`<div class="chain">${steps.join("<br>")}${n===22?"<br>22 = De Dwaas (0)":""}</div>
   <div class="row7" style="margin-top:16px">${cards.map(c=>cardHTML(c)).join("")}</div>
   ${cards.map((c,i)=>`<p><b>${i===0?(cards.length>1?"Persoonlijkheidskaart":"Persoonlijkheids- én zielskaart"):"Zielskaart"}: ${c.name}</b> — ${c.kw}. <span class="muted">${c.up}</span></p>`).join("")}`;
};

/* ===================== NAVIGATIE ===================== */
function go(p){
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("show",s.id===p));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  if(location.hash!=="#"+p) history.replaceState(null,"","#"+p);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
renderDeck("major"); renderStatic(); renderStats();
const h=location.hash.slice(1); if(h&&document.getElementById(h)) go(h);
</script>
